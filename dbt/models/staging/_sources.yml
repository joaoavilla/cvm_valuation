version: 2

sources:
  - name: cvm_dfp_raw
    description: "Raw da ingestão v2 — 1 CSV da CVM = 1 Parquet, particionado por ano"
    meta:
      external_location: "read_parquet('{{ env_var('CVM_RAW_DIR', '../data/raw/dfp') }}/ano=*/{name}.parquet', hive_partitioning = true)"
    tables:
      - name: dre_con
      - name: dre_ind
      - name: bpa_con
      - name: bpa_ind
      - name: bpp_con
      - name: bpp_ind
      - name: dfc_mi_con
      - name: dfc_mi_ind
      - name: dfc_md_con
      - name: dfc_md_ind
      - name: cadastro

