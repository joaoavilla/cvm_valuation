version: 2

# Camada de tipagem e normalização. Uma linha aqui é uma linha de demonstrativo da CVM,
# no grão (cd_cvm, tipo_df, dt_referencia, versao, ordem_exercicio, cd_conta, ds_conta).
# `ds_conta` está no grão de propósito: `cd_conta` não determina significado.
#
# `valor` é NULL quando a fonte se contradiz (dois valores para a mesma chave) ou quando a
# escala é desconhecida. `status_valor` diz qual dos dois. Ausência declarada, nunca desempate.

models:

  - name: stg_cvm__dre
    description: "DRE unificada (consolidada + individual), transformada a partir do raw CVM"
    columns:
      - name: cd_cvm
        description: "Código CVM da empresa"
        data_tests:
          - not_null

      - name: tipo_df
        description: "Tipo da demonstração financeira: consolidada ou individual"
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONSOLIDADO', 'INDIVIDUAL']

      - name: dt_fim_exercicio
        description: "Data final do período contábil ao qual o valor se refere"
        data_tests:
          - not_null

      - name: ds_conta
        description: >
          Descrição exata da conta na fonte. Faz parte do grão: é ela que desambigua o código.
        data_tests:
          # WARN e não ERROR: a fonte tem exatamente 2 linhas com descrição nula em 8,5 M
          # (BNDESPAR, dre_ind, 2019, conta 3.06.01.06, valor 0, conta não-fixa). Defeito da
          # CVM, medido em 2026-09-06. Fica visível sem travar o build; se o número crescer,
          # a fonte piorou e o grão precisa de outra defesa.
          - not_null:
              config:
                severity: warn

      - name: unidade
        description: >
          MOEDA para contas monetárias; POR_ACAO para o grupo 3.99 da DRE, que a CVM publica
          em reais por ação e ao qual ESCALA_MOEDA não se aplica.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['MOEDA', 'POR_ACAO']

      - name: status_valor
        description: >
          OK = a fonte traz um único valor para a chave. CONFLITO_FONTE = traz mais de um e
          nenhuma regra contábil desempata, então o valor fica NULL.
          ESCALA_DESCONHECIDA = ESCALA_MOEDA fora de {MIL, UNIDADE}.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'CONFLITO_FONTE', 'ESCALA_DESCONHECIDA']

      - name: valor
        description: >
          Valor em reais para contas MOEDA; em reais por ação para contas POR_ACAO.
          NULL quando status_valor <> 'OK' — ausência declarada, não zero e não desempate.
        data_tests:
          - not_null:
              config:
                where: "status_valor = 'OK'"

      - name: ordem_exercicio
        description: "Indica se o registro pertence ao exercício atual ou comparativo"
        data_tests:
          - accepted_values:
              arguments:
                values: ['ÚLTIMO', 'PENÚLTIMO']

